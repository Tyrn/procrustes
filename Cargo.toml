[package]
name = "procrustes"
version = "1.0.3"
authors = ["Tyrn <a@b.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
const_format = "0.2"
gag = "1"
regex = "1"
itertools = "0.15.0"
unicode-segmentation = "1"
tempfile = "3"
alphanumeric-sort = "1.4.3"
chrono = "0.4"
clap = "4"
taglib = "*"
glob = "0.3.0"
spinner = "0.5.0"
terminal-spinners = "0.3.2"
spinach = "3"
owo-colors = "4"

# For distribution — smallest, fastest binary
[profile.release]
lto = true
codegen-units = 1
strip = true

# For intensive development — fast rebuilds, near-release performance
[profile.release-dev]
inherits = "release"
opt-level = 2
lto = false
codegen-units = 16
incremental = true
strip = false
debug = 1
